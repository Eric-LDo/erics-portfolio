<div class="container reveal">
    <h2 class="section-title">Projetos desenvolvidos</h2>
    <ul>
        @for(item of arrayProjects(); track item.title){
            <li>
                <button type="button" class="card" (click)="openDialog(item)">
                    <span class="card__media">
                        <img
                            [src]="item.src"
                            [alt]="item.alt"
                            [attr.width]="item.width"
                            [attr.height]="item.height"
                            loading="lazy"
                        >
                    </span>
                    <span class="card__body">
                        <strong>{{ item.title }}</strong>
                        <span class="card__cta">
                            Ver detalhes
                            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                <path fill="currentColor" d="M16.2 13H4v-2h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6Z"/>
                            </svg>
                        </span>
                    </span>
                </button>
            </li>
        }
    </ul>
</div>
