<section class="container reveal">
  <h2 class="section-title">Conhecimentos</h2>
  <ul>
    @for(item of arrayKnowledge(); track item.title){
        <li [title]="item.title">
            <img
                [src]="item.src"
                [alt]="item.alt"
                loading="lazy"
                width="28"
                height="28"
            />
            <span>{{ item.title }}</span>
        </li>
    }
  </ul>
</section>
